<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0e1016"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg2)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#glow2)"/>
  <!-- broadcast rings: one announcer -> many hubs -->
  <g fill="none" stroke="#2563eb" stroke-width="6">
    <circle cx="128" cy="128" r="50" opacity="0.95"/>
    <circle cx="128" cy="128" r="78" opacity="0.5"/>
  </g>
  <!-- hub nodes sitting on the outer ring -->
  <g fill="#22c55e">
    <circle cx="186" cy="79" r="9"/>
    <circle cx="166" cy="194" r="9"/>
    <circle cx="53" cy="141" r="9"/>
  </g>
  <!-- announcer node at the centre -->
  <rect x="107" y="107" width="42" height="42" rx="12" fill="#eef1f6"/>
  <circle cx="128" cy="128" r="8" fill="#2563eb"/>
</svg>
